aid: adverity
name: Adverity
description: 'Adverity is a marketing data intelligence platform that integrates,
  harmonizes, transforms, and analyzes marketing and advertising data from hundreds
  of sources (Google Ads, Facebook Ads, LinkedIn Ads, and more) into a single, governed
  data foundation for reporting, dashboards, and downstream data warehouses. Adverity
  exposes a programmatic Management API across three surfaces (legacy /api/, /api/v1/
  for cross-workspace operations, and /api/v2/ for multi-range smart-pulling) for managing
  datastreams, authorizations, fetches, transformations, destinations, workspaces, and
  users, plus a UI-configured webhook surface with three events. It also runs a hosted
  remote Model Context Protocol (MCP) server at https://mcp.eu.adverity.com/mcp (beta,
  12 tools, OAuth 2.0 with PKCE and dynamic client registration) so AI assistants can
  monitor, configure, and control data pipelines in natural language. No OpenAPI is
  published; the REST contract is a documented endpoint table plus a public Postman
  collection, and API keys carry per-resource read/write scopes. The company is ISO/IEC
  27001 certified (TUV Austria), SOC 2 Type 2 audited, and GDPR/UK GDPR/CCPA/HIPAA
  compliant.'
