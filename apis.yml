apis:
- name: Adverity Management API
  description: 'The Adverity Management API provides programmatic access to the Adverity
    platform for managing datastreams, authorizations, fetches, transformations, data
    mappings, destinations, workspaces, and users. It exposes a legacy /api/ surface
    (the primary API), a newer /api/v1/ surface for cross-workspace operations such
    as smart schedule management, workspaces, users, bindings, custom monitors and
    API key rotation/introspection, and an /api/v2/ surface for multi-range datastream
    smart-pulling. All three are fully supported. Keys carry per-resource read/write
    scopes. Hosts are per-instance (https://{{INSTANCE}}/api/); no OpenAPI is published
    — the contract is a documented endpoint table plus a public Postman collection.'
  humanURL: https://docs.adverity.com/guides/management-api/introduction-management-api.html
  baseURL: https://www.adverity.com/api/
  tags:
  - Management API
  - Data Integration
