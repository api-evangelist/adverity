- name: Adverity MCP Server
  description: 'The Adverity MCP server is a hosted, remote Model Context Protocol
    endpoint that connects an AI assistant to an Adverity instance so it can monitor,
    configure, and control data pipelines in natural language. It publishes 12 tools
    covering datastreams, authorizations, fetches, errors, extracts, workspaces,
    transformations, mapping tables, data mapping, destinations, users, and notification
    subscriptions. Access is guarded by a real OAuth 2.0 authorization server
    (authorization code plus refresh, PKCE S256, RFC 7591 dynamic client registration);
    the user signs in with an instance URL and a Management API key, so the agent
    inherits exactly that key''s scopes. All write tools use a two-phase preview-then-confirm
    pattern. In beta, available to selected customers.'
  humanURL: https://docs.adverity.com/guides/mcp/using-mcp.html
  baseURL: https://mcp.eu.adverity.com/mcp
