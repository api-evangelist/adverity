aid: adverity
name: Adverity
description: 'Adverity is a marketing data intelligence platform that integrates,
  harmonizes, transforms, and analyzes marketing and advertising data from hundreds
  of sources (Google Ads, Facebook Ads, LinkedIn Ads, and more) into a single, governed
  data foundation for reporting, dashboards, and downstream data warehouses. Adverity
  exposes a programmatic Management API (legacy /api/ plus a newer /api/v1/ surface)
  for managing datastreams, authorizations, fetches, transformations, destinations,
  workspaces, and users, and ships an Adverity Atlas Model Context Protocol (MCP)
  server (beta) so AI assistants can monitor, configure, and control data pipelines
  in natural language. The company is ISO/IEC 27001 certified (TUV Austria), SOC 2
  Type 2 audited, and GDPR/UK GDPR/CCPA/HIPAA compliant.'
