    platform for managing datastreams, authorizations, fetches, transformations, data
    mappings, destinations, workspaces, and users. It exposes a legacy /api/ surface
    (the primary API) and a newer /api/v1/ surface for cross-workspace operations
    such as smart schedule management, workspaces, users, and API key rotation. Hosts
    are per-instance (https://{{INSTANCE}}/api/).'
