note: >-
  Adverity serves no /.well-known/ documents on its marketing (www) or documentation
  (docs) hosts, and no llms.txt on either. It DOES serve a real OAuth discovery surface
  on the MCP host, mcp.eu.adverity.com — RFC 8414 authorization-server metadata and
  RFC 9728 protected-resource metadata for the remote MCP server. That is the only
  machine-readable discovery document Adverity publishes anonymously, and it is what
  the WellKnown pointer in apis.yml refers to. Security reporting is published on the
  data-security page (HackerOne bug bounty, cybersecurity@adverity.com) rather than a
  security.txt; see security/adverity-vulnerability-disclosure.yml.
