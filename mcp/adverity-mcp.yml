tools:
- name: manage_datastream
  description: Lists, creates, and configures datastreams; view status, enable or disable pipelines, explore connector types and field options.
- name: manage_authorization
  description: Manages authorizations for connected data sources (Google Ads, Facebook Ads, LinkedIn Ads, etc.); create connections, monitor expiry, handle OAuth flows, refresh metadata, control account/profile permissions and grant-all flag.
- name: manage_fetch
  description: Controls data collection jobs (fetches).
- name: manage_error
  description: Lists errors and their state, retrieves details.
- name: manage_extract
  description: Lists and downloads data extracts.
- name: manage_workspace
  description: Lists workspaces and shows their structure.
- name: manage_transformation
  description: Creates, lists, and edits transformations.
- name: manage_mapping_table
  description: Lists, retrieves, and updates mapping tables.
- name: manage_data_mapping
  description: Maps a datastream's source columns to target columns.
- name: manage_destinations
  description: Creates and manages destinations.
- name: manage_user
  description: Lists and manages instance users.
- name: manage_notifications
  description: Manages notification subscriptions.
