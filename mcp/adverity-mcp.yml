notes: >-
  Adverity Atlas exposes the platform through a Model Context Protocol (MCP) server
  (beta). It lets an AI assistant monitor, configure, and control data pipelines in
  natural language. The specific per-instance server URL and setup config are
  published on the setup guide (mcp-setup.html) and provisioned per customer;
  not reproduced here.
