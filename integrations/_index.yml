- slug: adverity-hubspot-app-certification
  label: HubSpot App Certification
  partner: hubspot
  partner_name: HubSpot App Certification
  category: HubSpot certified app publisher
  type: register
  channel: standard-directory
  evidence: https://ecosystem.hubspot.com/marketplace/explore?eco_PRODUCT_TYPE=APP&eco_CERTIFIED=true
  source: edge
  relationship: standard-participant
  contract_reference:
    register: HubSpot App Marketplace Certified Apps (CERTIFIED filter on the storefront's public search JSON)
    standard: HubSpot App Certification
    spec_file: null
    role: certified-app-publisher
    registered_name: Adverity GmbH
    matched_domain: adverity.com
    matched_by: domain
    identity_source: the listing's own companyUrl (no lookup)
    certified_products:
    - product: HubSpot Certified App
      product_type: APP
      certifier: HubSpot (App Certification)
      listings: 1
      example_listing: https://ecosystem.hubspot.com/marketplace/listing/adverity
      lapsed: false
      lapsed_note: the certified flag is printed on a LIVE public listing card (CERTIFIED filter); HubSpot prints
        no certification date, so the badge reads as current
    signal_note: certified_products = ONE entry per product type (HubSpot Certified App), never per listing; listing
      counts are context
    detected_by: sweep-hubspot-app-marketplace.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
