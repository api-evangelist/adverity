  note: >-
    Release numbers are calendar-based, not semantic. Every release is documented under
    section headings including a dedicated "Management API" section that names concrete
    endpoints, query parameters and status codes — one of the more machine-legible
    changelogs in the marketing-data category, even though no OpenAPI backs it.
